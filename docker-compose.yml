services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ops
      POSTGRES_USER: ops_user
      POSTGRES_PASSWORD: ops_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_user -d ops"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-portal:
    build: .
    command: uvicorn mock_portal.main:app --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"

  api:
    build: .
    env_file: .env
    command: sh -c "alembic upgrade head && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-portal:
        condition: service_started

  worker:
    build: .
    env_file: .env
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build: .
    env_file: .env
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
