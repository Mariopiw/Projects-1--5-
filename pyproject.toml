[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-operations-automation-platform"
version = "0.1.0"
description = "Production-style portfolio platform for reconciliation, exception workflows, AI-assisted triage, and legacy-system automation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyjwt>=2.9",
  "pwdlib[argon2]>=0.2",
  "python-multipart>=0.0.9",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "httpx>=0.27",
  "playwright>=1.48",
  "alembic>=1.13"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
